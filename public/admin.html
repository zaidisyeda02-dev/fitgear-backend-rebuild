<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Admin Panel, FitGear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
      .admin-table th, .admin-table td { text-align: left; padding: 0.625rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
      .admin-table th { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
      .admin-tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.5rem; }
      .admin-tab { padding: 0.625rem 1.25rem; border: 1px solid var(--border); border-radius: 999px; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text); }
      .admin-tab.active { background: var(--volt); border-color: var(--volt); color: var(--volt-text); font-weight: 700; }
      .stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-top: 1.5rem; }
      @media (min-width: 768px) { .stat-grid { grid-template-columns: repeat(4, 1fr); } }
      .stat-card { padding: 1.25rem; text-align: center; }
      .stat-card .num { font-family: "Oswald", sans-serif; font-size: 32px; font-weight: 600; margin: 0; }
      .stat-card .lbl { margin: 0.25rem 0 0; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
      .table-wrap { overflow-x: auto; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="header-row">
          <a href="/" class="logo-btn" style="text-decoration:none;color:inherit">
            <span class="logo-word">FIT<b style="color:var(--volt)">GEAR</b></span>
          </a>
          <div class="header-nav-right">
            <a href="/" class="nav-btn" style="text-decoration:none">Shop</a>
            <button type="button" class="nav-btn" id="sign-out-btn" style="display:none">Sign out</button>
          </div>
        </div>
      </div>
    </header>
    <main class="container-mid" style="padding-top:2rem;padding-bottom:3rem">
      <h1 class="font-display" style="font-size:36px;font-weight:600;letter-spacing:0.1em;text-align:center;text-transform:uppercase;margin:0">Admin Panel</h1>
      <p style="margin:0.5rem 0 0;text-align:center;font-size:15px;color:var(--dim)">Orders, messages and subscribers for FitGear.</p>
      <div id="admin-root" style="margin-top:2rem"></div>
    </main>
    <script src="/admin.js"></script>
  </body>
</html>
